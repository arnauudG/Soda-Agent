name: IaC Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pre_commit:
    name: pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # Terragrunt is required by the terragrunt-* pre-commit hooks.
      # Pin a version to keep CI deterministic.
      - name: Install Terragrunt
        run: |
          set -euo pipefail
          TG_VERSION="v0.56.3"
          curl -sSL -o terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt
          terragrunt --version

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit
        env:
          # If you need to skip a hook temporarily, set SKIP.
          # Example: SKIP=terraform_tflint
          SKIP: ''
        run: |
          pre-commit run --all-files
